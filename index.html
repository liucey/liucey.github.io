<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车车工作室 LUCE STUDIO</title>
<script src="https://aisearch-task.bj.bcebos.com/static/tailwindcss-3.4.17.js"></script>
<style>
  :root {
    --paper: #f5f0e8;
    --ink: #2c2418;
    --muted: #8a7a62;
    --accent: #a0522d;
    --gold: #c49a6c;
    --line: rgba(160,82,45,0.25);
  }
  * { -webkit-font-smoothing: antialiased; }
  html, body { margin:0; padding:0; }
  body {
    font-family: 'Songti SC', 'STSong', 'SimSun', 'Noto Serif CJK SC', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 纸张质感背景 */
  .paper-bg {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(196,154,108,0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 100%, rgba(160,82,45,0.12) 0%, transparent 50%),
      linear-gradient(180deg, #f8f3eb 0%, #efe7d8 100%);
    position: relative;
  }
  .paper-bg::before {
    content: '';
    position: absolute; inset:0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.6 0 0 0 0 0.5 0 0 0 0 0.35 0 0 0 0.06 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }

  /* 星空 */
  .star {
    position: absolute;
    background: #c49a6c;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle var(--dur,3s) ease-in-out var(--delay,0s) infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity:0; transform: scale(0.5); }
    50% { opacity: var(--max-o,0.8); transform: scale(1); }
  }

  /* 流星 */
  .shooting-star {
    position: absolute;
    width: 2px; height: 2px;
    background: linear-gradient(90deg, #c49a6c, transparent);
    border-radius: 50%;
    opacity: 0;
  }
  .shooting-star::after {
    content:''; position:absolute; right:0; top:50%;
    width: 80px; height:1px;
    background: linear-gradient(90deg, transparent, #c49a6c);
    transform: translateY(-50%);
  }
  @keyframes shoot {
    0% { opacity:0; transform: translate(0,0) rotate(-20deg); }
    10% { opacity:1; }
    70% { opacity:1; }
    100% { opacity:0; transform: translate(-300px, 110px) rotate(-20deg); }
  }

  /* 文字入场 */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .reveal {
    opacity: 0;
    animation: fadeUp 1.4s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .d1 { animation-delay: 0.3s; }
  .d2 { animation-delay: 1.0s; }
  .d3 { animation-delay: 1.8s; }
  .d4 { animation-delay: 2.6s; }
  .d5 { animation-delay: 3.4s; }
  .d6 { animation-delay: 4.2s; }

  /* 竖排装饰 */
  .vertical-text {
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.5em;
  }

  /* 分割线 */
  .divider {
    display: flex; align-items: center; gap: 16px;
    color: var(--muted);
  }
  .divider::before, .divider::after {
    content:''; flex:1; height:1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }

  /* 印章效果 */
  .seal {
    display: inline-flex;
    align-items: center; justify-content: center;
    width: 64px; height: 64px;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: 'Songti SC', serif;
    font-size: 14px;
    line-height: 1.2;
    text-align: center;
    border-radius: 4px;
    transform: rotate(-6deg);
    opacity: 0.85;
    letter-spacing: 2px;
    position: relative;
  }
  .seal::before {
    content:''; position:absolute; inset:3px;
    border: 1px solid var(--accent);
    border-radius: 2px;
    opacity: 0.5;
  }

  /* 主文字排版 */
  .main-text {
    font-size: clamp(18px, 2.4vw, 26px);
    line-height: 2.2;
    letter-spacing: 0.08em;
    text-align: justify;
    text-align-last: center;
    text-indent: 2em;
  }
  .main-text .highlight {
    color: var(--accent);
    font-weight: 600;
  }
  /* 开篇对仗句独立成行 */
  .opening-line {
    font-size: clamp(22px, 3vw, 32px);
    line-height: 1.8;
    letter-spacing: 0.15em;
    text-align: center;
    text-indent: 0;
    margin-bottom: 1.2em;
    font-weight: 500;
    color: var(--ink);
  }
  .opening-line .highlight {
    color: var(--accent);
    font-weight: 700;
  }
  .closing-line {
    font-size: clamp(22px, 3vw, 32px);
    line-height: 1.8;
    letter-spacing: 0.2em;
    text-align: center;
    text-indent: 0;
    margin-top: 0.6em;
    margin-bottom: 0;
    font-weight: 500;
    color: var(--ink);
  }
  .closing-line .highlight {
    color: var(--accent);
    font-weight: 700;
  }
  .main-text { margin-bottom: 0; }

  /* 署名 */
  .signature {
    font-family: 'Songti SC', 'STSong', serif;
    letter-spacing: 0.3em;
  }

  /* 年份大字 */
  .year-mark {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: 300;
    background: linear-gradient(135deg, var(--accent), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* 时间轴小装饰 */
  .timeline-dots {
    display: flex; align-items: center; gap: 6px;
  }
  .tl-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    opacity: 0.4;
  }
  .tl-dot.active { opacity: 1; background: var(--accent); }

  /* 边框装饰 */
  .frame-line {
    position: absolute;
    background: var(--line);
  }

  @media (max-width: 768px) {
    .main-text { font-size: 17px; line-height: 2.1; letter-spacing: 0.05em; }
    .vertical-deco { display: none; }
  }
</style>
</head>
<body class="paper-bg">

<!-- 星空容器 -->
<div id="stars" class="absolute inset-0 z-0 overflow-hidden pointer-events-none"></div>

<!-- 边框装饰 -->
<div class="frame-line" style="top:24px; left:24px; right:24px; height:1px;"></div>
<div class="frame-line" style="bottom:24px; left:24px; right:24px; height:1px;"></div>
<div class="frame-line" style="top:24px; bottom:24px; left:24px; width:1px;"></div>
<div class="frame-line" style="top:24px; bottom:24px; right:24px; width:1px;"></div>

<!-- 四角装饰 -->
<svg class="absolute top-4 left-4 z-10" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#a0522d" stroke-width="1" opacity="0.5">
  <path d="M4 16V4h12M4 4l12 12"/>
</svg>
<svg class="absolute top-4 right-4 z-10" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#a0522d" stroke-width="1" opacity="0.5">
  <path d="M36 16V4H24M36 4 24 16"/>
</svg>
<svg class="absolute bottom-4 left-4 z-10" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#a0522d" stroke-width="1" opacity="0.5">
  <path d="M4 24v12h12M4 36l12-12"/>
</svg>
<svg class="absolute bottom-4 right-4 z-10" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#a0522d" stroke-width="1" opacity="0.5">
  <path d="M36 24v12H24M36 36 24 24"/>
</svg>

<main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 md:px-12 py-20">

  <!-- 顶部：日期 -->
  <div class="reveal d1 flex flex-col items-center mb-8 md:mb-12">
    <div class="text-xs md:text-sm tracking-[0.4em] text-[var(--muted)] mb-3">A FAREWELL · 2010 — 2026</div>
    <div class="divider w-48 md:w-64 text-[var(--muted)] text-xs tracking-widest">拾 陆 载</div>
  </div>

  <!-- 标题 -->
  <div class="reveal d2 text-center mb-10 md:mb-14">
    <h1 class="year-mark text-5xl md:text-7xl lg:text-8xl font-light mb-3">16</h1>
    <p class="text-[var(--muted)] text-sm md:text-base tracking-[0.5em]">年 · 一 路 同 行</p>
  </div>

  <!-- 正文 -->
  <article class="reveal d3 max-w-3xl w-full mb-12 md:mb-16">
    <p class="opening-line">
      <span class="highlight">十六载斗转星移</span>，<span class="highlight">万千事初心依旧</span>。
    </p>
    <p class="main-text text-[var(--ink)] mb-6">
      信息门户从寥寥几站到上百网站，记载了一代石油人信息系统更迭路径，今天已经划上了一个遗憾的句号。
    </p>
    <p class="closing-line">
      ——<span class="highlight">车多路远，有缘再见</span>。
    </p>
  </article>

  <!-- 时间轨迹装饰 -->
  <div class="reveal d4 flex items-center gap-4 mb-12 md:mb-16">
    <span class="text-xs text-[var(--muted)] tracking-widest">2010</span>
    <div class="timeline-dots">
      <span class="tl-dot active"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot"></span>
      <span class="tl-dot active"></span>
      <span class="tl-dot active" style="width:10px;height:10px;box-shadow:0 0 12px rgba(160,82,45,0.5);"></span>
    </div>
    <span class="text-xs text-[var(--accent)] tracking-widest font-semibold">2026</span>
  </div>

  <!-- 分割 -->
  <div class="reveal d5 w-24 h-[1px] bg-gradient-to-r from-transparent via-[var(--line)] to-transparent mb-10"></div>

  <!-- 署名 -->
  <div class="reveal d6 flex flex-col md:flex-row items-center gap-6 md:gap-10">
    <div class="text-right">
      <p class="signature text-xl md:text-2xl text-[var(--ink)] mb-1">车车工作室</p>
      <p class="text-[var(--muted)] text-sm tracking-widest">2026 年 9 月 20 日</p>
    </div>
    <div class="seal">
      车车<br>存念
    </div>
  </div>

  <!-- 底部小字 -->
  <div class="mt-16 text-[11px] md:text-xs text-[var(--muted)] tracking-[0.3em] opacity-60 reveal d6">
    感 谢 曾 经 的 每 一 次 点 击 与 相 伴
  </div>

</main>

<!-- 左侧竖排装饰 -->
<div class="vertical-deco absolute left-6 md:left-10 top-1/2 -translate-y-1/2 z-10 opacity-40">
  <div class="vertical-text text-[var(--muted)] text-xs tracking-widest" style="font-size:11px;letter-spacing:0.6em;">
    斗 转 星 移 · 初 心 不 改
  </div>
</div>
<!-- 右侧竖排装饰 -->
<div class="vertical-deco absolute right-6 md:right-10 top-1/2 -translate-y-1/2 z-10 opacity-40">
  <div class="vertical-text text-[var(--muted)] text-xs" style="font-size:11px;letter-spacing:0.6em;">
    山 高 水 长 · 后 会 有 期
  </div>
</div>

<script>
  // 生成星空
  const starsContainer = document.getElementById('stars');
  const starCount = 60;
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.8;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
    star.style.setProperty('--delay', (Math.random() * 5) + 's');
    star.style.setProperty('--max-o', (Math.random() * 0.6 + 0.3));
    starsContainer.appendChild(star);
  }

  // 流星
  function createShootingStar() {
    const s = document.createElement('div');
    s.className = 'shooting-star';
    s.style.left = (Math.random() * 60 + 30) + '%';
    s.style.top = (Math.random() * 30 + 10) + '%';
    s.style.animation = `shoot ${1.2 + Math.random()*0.5}s linear forwards`;
    starsContainer.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
  setInterval(createShootingStar, 4500);
  setTimeout(createShootingStar, 1500);
</script>

</body>
</html>
